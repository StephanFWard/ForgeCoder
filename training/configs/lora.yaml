# ForgeCoder LoRA training configuration.
# Designed for a GPU host (the 6 GB laptop is the inference target).

base_model: Qwen/Qwen2.5-Coder-1.5B-Instruct

output_dir: models/adapters/forgecoder-1.5b

lora:
  r: 8
  alpha: 16
  dropout: 0.05
  bias: none
  task_type: CAUSAL_LM

target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj

training:
  epochs: 2
  learning_rate: 0.0002
  batch_size: 1
  gradient_accumulation_steps: 16
  max_seq_length: 2048
  gradient_checkpointing: true
  fp16: true

evaluation:
  every_steps: 250

save:
  every_steps: 250
  keep_last: 2