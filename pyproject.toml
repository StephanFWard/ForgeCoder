# ForgeCoder — pyproject.toml
#
# The Python side of the project is split between two source trees:
#   apps/server/forge_server   -> `forge_server` package (local Forge API)
#   core/                      -> `core` package (indexing, retrieval, inference,
#                                 patching, git, memory)
# Both are installed by `pip install -e .` so they can import each other.

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forgecoder"
version = "0.1.0"
description = "A thin, local-first coding platform around a 1.5B coder model (Qwen2.5-Coder via llama.cpp)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "ForgeCoder Contributors" }]
keywords = ["llm", "code", "llama.cpp", "local-first", "vscode", "qlora"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx>=0.27",
    "pydantic>=2.0",
    "psutil>=5.9",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# Training extras are intentionally NOT part of the default install.
# Training runs on a GPU host; the runtime only needs the weights.
train = [
    "torch>=2.2",
    "transformers>=4.40",
    "peft>=0.11",
    "datasets>=2.18",
    "accelerate>=0.29",
    "bitsandbytes>=0.43",
]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]
mcp = [
    "mcp>=1.0,<2",
]
# Upstream `jev` (PyPI 0.3.0) requires Python >= 3.14 and a paid TypeSafe API
# key, so it is an optional extra rather than a dependency: on older
# interpreters the environment marker makes pip skip it, and
# `core.system_one.jev_compat` provides the same decorator API against the free
# backends. `pip install -e ".[jev]"` is safe on every supported Python.
jev = [
    "jev>=0.3.0; python_version >= '3.14'",
]

[project.scripts]
forge-server = "forge_server.main:run"
forge-index = "core.indexer.index:cli"
forge-mcp = "core.mcp_server:main"
forge-decide = "core.system_one.cli:main"

[tool.setuptools]
# Two source roots, one distribution: `forge_server` lives under apps/server/,
# `core` at the repository root. Both roots must appear in `packages.find.where`
# — and the second one has to be "." rather than "core", because setuptools
# derives package names *relative to each root*, so a "core" root emits
# `agent`/`indexer`/... and never `core` itself. Without this, an installed
# `core.*` entry point (`forge-index`, `forge-mcp`, `forge-decide`) fails with
# "No module named 'core'" outside the repository root.
package-dir = { "forge_server" = "apps/server/forge_server", "core" = "core" }

[tool.setuptools.packages.find]
where = ["apps/server", "."]
include = ["forge_server*", "core*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests", "apps/server/tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["models", "training/lora", ".venv"]

[tool.ruff.lint]
# Explicit rule set: this repo's CI contract is F (pyflakes) + E4/E7/E9 +
# W (pycodestyle) + I (isort) + UP (pyupgrade).
select = ["E4", "E7", "E9", "F", "I", "UP", "W"]
# B008: FastAPI's `Depends()` / `Header()` in argument defaults is the
# framework's canonical dependency-injection idiom.
ignore = ["B008"]